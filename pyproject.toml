[project]
name = "lubo-daren"
version = "1.0.3"
description = "录播达人直播自动录制客户端"
authors = [{ name = "录播达人" }, { name = "Hmily" }]
license = {text = "Apache-2.0"}
readme = "README.md"
url='https://github.com/ihmily/StreamCap'
requires-python = ">=3.10,<4.0"

dependencies = [
    "flet[desktop,cli]==0.85.3",
    "flet-video==0.85.3",
    "httpx[http2]>=0.28.1",
    "screeninfo>=0.8.1",
    "aiofiles>=25.1.0",
    "streamget>=4.0.10",
    "python-dotenv>=1.2.2",
    "cachetools>=7.1.4",
    "pystray>=0.19.5",
    "plyer>=2.1.0",
    "deprecated>=1.3.1",
    "cryptography==46.0.3",
    "pywebview==6.2.1",
]

[project.urls]
Documentation = "https://github.com/ihmily/StreamCap/wiki"
Homepage = "https://github.com/ihmily/StreamCap"
Source = "https://github.com/ihmily/StreamCap"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.flet]
org = "io.github.ihmily.streamcap"
product = "录播达人"
company = "录播达人"
copyright = "Copyright (C) 2026 录播达人. Based on StreamCap by Hmily."
compile.app = false
compile.packages = false
compile.cleanup = true

[tool.flet.app]
path ="."

[tool.poetry]
package-mode = false
packages = [
    { include = "app", from = "." },
]

[tool.poetry.dependencies]
flet = { version = "1.0.5", extras = ["desktop", "cli"] }
flet-video = "^0.85.3"
httpx = "^0.28.1"
screeninfo = "~0.8.1"
aiofiles = "~25.1.0"
streamget = ">=4.0.10"
python-dotenv = "~1.2.2"
cachetools = ">=7.1.6"
pystray = "~0.19.5"
plyer = "~2.1.0"
deprecated = ">=1.3.1"
cryptography = "46.0.3"
pywebview = "6.2.1"


[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "~0.16.0"
